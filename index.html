<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>π Terminal</title>
  <script src="https://cdn.jsdelivr.net/npm/decimal.js@10/decimal.min.js"></script>
  <style>
    html, body { height: 100%; margin: 0; padding: 0; background: #000; }
    body {
      color: #00ff33;
      font-family: 'Fira Mono', monospace;
      display: flex; flex-direction: column; height: 100vh;
      font-size: 2vh; line-height: 1.2;
    }
    #header { padding: 1vh; font-size: 2.5vh; }
    pre#digits {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      white-space: pre;
      margin: 0;
      padding: 1vh;
    }
  </style>
</head>
<body>
  <div id="header">π &gt;&gt; infinite live Machin’s formula</div>
  <pre id="digits">3.</pre>
  <script>
    // Configuration
    const INITIAL_DIGITS = 1000;   // Start with 1k digits
    const CHUNK_SIZE = 500;         // Compute 500 new digits per chunk
    const BUFFER_THRESHOLD = 200;   // Start computing when 200 digits remain
    const COMPUTE_INTERVAL = 50;    // ms between computation steps (to avoid UI freeze)
    
    // State management
    let allDigits = "";             // All computed digits (after "3.")
    let base = 0;                   // Digits already displayed
    let computing = false;          // Computation lock
    let charWidth = 0;
    let lineHeight = 0;
    
    // Precompute initial digits
    function computePiChunk(precision) {
      Decimal.set({ precision: precision + 20 });
      const one = new Decimal(1);
      
      function arctan(x) {
        let term = one.div(x);
        let sum = term;
        let k = 1;
        const threshold = Decimal.pow(10, -precision - 5);
        
        while (term.abs().gt(threshold)) {
          term = term.neg()
                    .div(x.mul(x))
                    .times(2 * k - 1)
                    .div(2 * k + 1);
          sum = sum.plus(term);
          k++;
        }
        return sum;
      }
      
      const piDec = arctan(new Decimal(5)).times(16)
                     .minus(arctan(new Decimal(239)).times(4));
      return piDec.toFixed(precision).slice(2, precision + 2); // Only fractional part
    }

    // Compute initial chunk
    allDigits = computePiChunk(INITIAL_DIGITS);

    // Measure character cell dimensions
    function measureDimensions() {
      const comp = getComputedStyle(document.body);
      const span = document.createElement('span');
      span.textContent = '0';
      span.style.visibility = 'hidden';
      span.style.position = 'absolute';
      span.style.fontFamily = comp.fontFamily;
      span.style.fontSize = comp.fontSize;
      document.body.appendChild(span);
      const rect = span.getBoundingClientRect();
      charWidth = rect.width;
      lineHeight = rect.height;
      document.body.removeChild(span);
    }

    // Compute grid dimensions
    function updateGrid() {
      if (!charWidth || !lineHeight) measureDimensions();
      const cols = Math.floor(window.innerWidth / charWidth);
      const headerH = document.getElementById('header').clientHeight;
      const rows = Math.floor((window.innerHeight - headerH) / lineHeight) - 1;
      return { cols, rows };
    }

    // Background computation of next chunk
    function scheduleChunkComputation() {
      if (computing || allDigits.length - base > BUFFER_THRESHOLD) return;
      
      computing = true;
      const newPrecision = allDigits.length + CHUNK_SIZE;
      
      // Break computation into microtasks to avoid UI blocking
      setTimeout(() => {
        const newDigits = computePiChunk(newPrecision).slice(allDigits.length);
        allDigits += newDigits;
        computing = false;
      }, COMPUTE_INTERVAL);
    }

    // Main display loop
    const digitsEl = document.getElementById('digits');
    const lines = [];
    let current = '3.';

    function tick() {
      const grid = updateGrid();
      
      // Add next digit if available
      if (base < allDigits.length) {
        current += allDigits[base++];
      }
      
      // Wrap full lines
      while (current.length >= grid.cols + 2) { // +2 for "3."
        lines.push(current.slice(0, grid.cols));
        current = current.slice(grid.cols);
      }
      
      // Trim history
      while (lines.length > grid.rows) lines.shift();
      
      // Render
      digitsEl.textContent = lines.concat([current]).join('\n');
      digitsEl.scrollTop = digitsEl.scrollHeight;
      
      // Schedule next computation if needed
      scheduleChunkComputation();
      
      // Continue indefinitely
      setTimeout(tick, 50);
    }

    // Handle resize
    window.addEventListener('resize', () => {
      updateGrid();
      digitsEl.textContent = lines.concat([current]).join('\n');
    });

    // Start
    tick();
  </script>
</body>
</html>
